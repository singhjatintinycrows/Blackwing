<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Blackwing{% endblock %}</title>
  <link rel="icon" href="/static/img/logo-mark.svg">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a href="/" style="display:flex;align-items:center;gap:10px">
        <img src="/static/img/logo-mark.svg" alt="Tiny Crows">
        <span class="name">Black<b>wing</b></span>
      </a>
      <div class="spacer"></div>
      <nav><a href="/">New assessment</a></nav>
    </div>
  </header>
  <main class="wrap {% block wrapclass %}{% endblock %}">
    {% block body %}{% endblock %}
    <div class="footer-note">
      Detection &amp; confirmation only — Blackwing proves findings with minimum evidence and never
      exploits, exfiltrates, or persists. Test only targets you are authorised to assess.
    </div>
  </main>
</body>
</html>
