{% extends "base.html" %}
{% block title %}Sign in · Blackwing{% endblock %}
{% block body %}
<h1>Sign in</h1>
<p class="sub">Blackwing is not open to anonymous submission. In production this is your org SSO.</p>
<div class="card" style="max-width:440px">
  <form method="post" action="/login">
    <label>Identity <span class="req">*</span></label>
    <input type="text" name="identity" placeholder="you@tinycrows.com" required>
    <div class="hint">Dev seam for SSO (OIDC/SAML). Reviewers are set via BLACKWING_REVIEWERS.</div>
    <div style="margin-top:16px"><button class="btn" type="submit">Continue</button></div>
  </form>
</div>
{% endblock %}
